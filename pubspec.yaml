name: asan
description: ASAN — marketplace to buy, sell, work and hire.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  provider: ^6.1.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  video_player: ^2.9.5
  chewie: ^1.11.1
  image_picker: ^1.1.2
  web: ^1.1.1
  cross_file: ^0.3.4+2
  file_picker: ^10.3.3
  cached_network_image: ^3.4.1
  geolocator: ^13.0.4
  flutter_compass: ^0.8.1
  adhan: ^2.0.0
  hijri: ^3.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  timeago: ^3.7.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.3
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.3.0
  shared_preferences: ^2.5.3
  percent_indicator: ^4.2.3
  flutter_markdown: ^0.7.6+2
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_foreground.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
